plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Create, Sophisticated Backpacks, InSight Chests에는 컴파일 의존성이 없습니다.
// 레지스트리 ID와 NeoForge 표준 IItemHandler capability만 사용하기 때문입니다.
// 개발 환경에서 같이 띄워 보려면 아래처럼 런타임 의존성을 추가하세요.
//
// repositories {
//     maven { url = 'https://maven.createmod.net' }
//     maven { url = 'https://maven.su5ed.dev/releases' }
// }
// dependencies {
//     runtimeOnly "com.simibubi.create:create-1.21.1:<버전>:slim" ...
// }

// JEI API (MIT, mezz). libs/ 안의 jar는 JEI 19.44.0.401에서 mezz/jei/api 클래스만 뽑은 것으로,
// JEI의 "+" 줄 버튼을 컴파일하기 위한 용도입니다. 실행 때는 설치된 JEI를 사용합니다.
dependencies {
    compileOnly files('libs/jei-api-19.44.0.401.jar')
}

// 컴파일용 가짜(stub) 선언(InSight Chests, EMI)은 jar에 넣지 않습니다. 실제 클래스는 각 모드 안에 있습니다.
// 같은 이름의 클래스가 이 모드 jar에 들어가면 그 모드를 망가뜨릴 수 있으므로 반드시 제외합니다.
jar {
    exclude 'com/mrsun/**'
    exclude 'dev/emi/**'
    exclude 'net/p3pp3rf1y/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
